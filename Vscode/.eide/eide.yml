          folders: []
        - name: CMSIS
          files:
            - path: ../Core/Src/system_stm32h7xx.c
          folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: a6518fa1ff7a713dcbd7f22465e7e07f
targets:
  LVGL:
    cppPreprocessAttrs:
      defineList:
        - USE_PWR_LDO_SUPPLY
        - USE_HAL_DRIVER
        - STM32H723xx
      incList:
        - .
        - ../Core/Inc
        - ../Drivers/STM32H7xx_HAL_Driver/Inc
        - ../Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - ../Drivers/CMSIS/Include
        - .cmsis/include
        - ../MDK-ARM/RTE/_LVGL
      libList: []
    excludeList:
      - ../Core/lvgl/examples/anim
      - ../Core/lvgl/examples/arduino
      - ../Core/lvgl/examples/assets
      - ../Core/lvgl/examples/event
      - ../Core/lvgl/examples/get_started
      - ../Core/lvgl/examples/grad
      - ../Core/lvgl/examples/layouts
      - ../Core/lvgl/examples/libs
      - ../Core/lvgl/examples/others
      - ../Core/lvgl/examples/porting
      - ../Core/lvgl/examples/scroll
      - ../Core/lvgl/examples/styles
      - ../Core/lvgl/examples
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            optimization: level-3
            warnings: ac5-like-warnings
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $outputTaskExcludes:
              - .bin
            misc-controls: --diag_suppress=L6329
            output-format: elf
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
                size: "0x50000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: true
              mem:
                size: "0x100000"
                startAddr: "0x24000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x200000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: ""
        eraseChipCommand: ""
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32h7x
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/lvgl.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/lvgl.pyocd.yaml
        otherCmds: ""
        speed: 4M
        targetName: cortex_m
    uploader: OpenOCD
